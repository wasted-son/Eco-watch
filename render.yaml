# ═══════════════════════════════════════════════════════
#  EcoAlert — Render.com Deployment Config
#  Alternative to Railway — also free, no card needed
#  https://render.com
# ═══════════════════════════════════════════════════════

services:
  - type: web
    name: eco-alert
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
